<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H. P. Lovecraft — Lectura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Special+Elite&display=swap');

  :root{
    --bg: #08080b;
    --text: #e8e3d3;
    --text-dim: #9a9587;
    --accent: #8fb389;
    --border: rgba(232,227,211,0.15);
    --font-display: 'Cinzel', serif;
    --font-body: 'EB Garamond', serif;
    --font-mono: 'Special Elite', monospace;
  }
  [data-theme="light"]{
    --bg: #f3f1e8;
    --text: #14140f;
    --text-dim: #4a4738;
    --accent: #3d5240;
    --border: rgba(20,20,15,0.15);
  }

  *{ box-sizing: border-box; }
  body{
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 1.15rem;
    line-height: 1.75;
    transition: background 0.3s ease, color 0.3s ease;
  }

  .top-bar{
    position: sticky; top: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 32px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    z-index: 10;
  }
  .back-link{
    font-family: var(--font-mono);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    text-decoration: none;
    display: flex; align-items: center; gap: 8px;
  }
  .back-link:hover{ color: var(--accent); }

  .theme-toggle{
    display: flex; align-items: center; gap: 8px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 3px;
    padding: 8px 14px;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .theme-toggle:hover{ color: var(--accent); border-color: var(--accent); }
  .theme-toggle svg{ width: 16px; height: 16px; }

  main{ max-width: 720px; margin: 0 auto; padding: 56px 24px 120px; }

  .story-no{
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    display: block;
    margin-bottom: 18px;
  }
  h1{
    font-family: var(--font-display);
    font-size: clamp(2rem, 4vw, 2.8rem);
    margin: 0 0 8px;
    line-height: 1.15;
  }
  h2{
    font-family: var(--font-body);
    font-style: italic;
    font-weight: 400;
    font-size: 1.3rem;
    color: var(--text-dim);
    margin: 0 0 40px;
  }

  .story-body p{ margin: 0 0 1.4em; }
  .story-body p:first-of-type::first-letter{
    font-family: var(--font-display);
    font-size: 3em;
    float: left;
    line-height: 0.8;
    padding: 0.05em 0.1em 0 0;
    color: var(--accent);
  }
  .story-body blockquote{
    margin: 2em 0;
    padding: 0.4em 0 0.4em 1.2em;
    border-left: 3px solid var(--accent);
    font-style: italic;
    color: var(--text-dim);
  }

  .story-footnote{
    margin-top: 56px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--text-dim);
    letter-spacing: 0.03em;
  }

  .state-message{
    max-width: 720px;
    margin: 100px auto;
    text-align: center;
    font-family: var(--font-mono);
    color: var(--text-dim);
    padding: 0 24px;
  }
</style>
</head>
<body>

<div class="top-bar">
  <a class="back-link" href="../lovecraft.html">&larr; Volver al catálogo</a>
  <button class="theme-toggle" id="theme-toggle" type="button">
    <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
    <span id="theme-label">Modo claro</span>
  </button>
</div>

<main id="story-container">
  <p class="state-message" id="loading-message">Invocando el texto…</p>
</main>

<script>
(function () {
  'use strict';

  // ---- Tema claro/oscuro ----
  const root = document.documentElement;
  const toggleBtn = document.getElementById('theme-toggle');
  const themeLabel = document.getElementById('theme-label');
  const themeIcon = document.getElementById('theme-icon');

  function applyTheme(theme) {
    if (theme === 'light') {
      root.setAttribute('data-theme', 'light');
      themeLabel.textContent = 'Modo oscuro';
    } else {
      root.removeAttribute('data-theme');
      themeLabel.textContent = 'Modo claro';
    }
  }

  const savedTheme = localStorage.getItem('lovecraft-theme') || 'dark';
  applyTheme(savedTheme);

  toggleBtn.addEventListener('click', () => {
    const current = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    const next = current === 'light' ? 'dark' : 'light';
    applyTheme(next);
    localStorage.setItem('lovecraft-theme', next);
  });

  // ---- Carga del cuento según ?no= en la URL ----
  const params = new URLSearchParams(window.location.search);
  const no = params.get('no');
  const container = document.getElementById('story-container');

  function renderMessage(text) {
    container.innerHTML = `<p class="state-message">${text}</p>`;
  }

  if (!no) {
    renderMessage('No se especificó ningún cuento. Vuelve al catálogo y elige uno.');
    return;
  }

  fetch('lovecraft-stories.json')
    .then((res) => res.json())
    .then((stories) => {
      const story = stories.find((s) => String(s.no) === String(no));
      if (!story) {
        renderMessage('Este cuento todavía no tiene texto disponible.');
        return;
      }
      container.innerHTML = `
        <span class="story-no">Nº ${story.no}</span>
        <h1>${story.titleEnglish}</h1>
        <h2>${story.titleSpanish}</h2>
        <div class="story-body">${story.text}</div>
        ${story.footnote ? `<p class="story-footnote">${story.footnote}</p>` : ''}
      `;
      document.title = `${story.titleEnglish} — H. P. Lovecraft`;
    })
    .catch((err) => {
      console.error(err);
      renderMessage('No se pudo cargar el texto. Si abriste el archivo directamente en el navegador, ejecuta un servidor local (ej. "npx serve").');
    });
})();
</script>
</body>
</html>
